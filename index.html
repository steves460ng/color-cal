<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="CMYK 단색 측정, 계조 보정 및 검증 작업실"
    />
    <meta name="theme-color" content="#171f32" />
    <title>Color Cal · CMYK 단색 캘리브레이션</title>
    <link rel="stylesheet" href="./css/main.css" />
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#content">본문으로 이동</a>
    <header class="topbar">
      <a class="brand" href="#projects"
        ><span class="brand-icon" aria-hidden="true">▥</span> Color Cal
        <small>단색 캘리브레이션 작업실</small></a
      >
      <div class="top-actions">
        <span id="active-project"></span
        ><span id="save-status" role="status">저장소 연결 중…</span
        ><button id="backup" type="button">JSON 백업</button
        ><button id="restore" type="button">복원</button
        ><input
          id="restore-file"
          type="file"
          accept=".json,application/json"
          hidden
        />
      </div>
    </header>
    <div class="shell">
      <aside>
        <label for="project-select">현재 프로젝트</label
        ><select id="project-select" aria-label="현재 프로젝트"></select>
        <div id="project-meta"></div>
        <nav id="navigation" aria-label="작업 단계"></nav>
        <nav class="help-navigation" aria-label="도움말">
          <a
            id="help-manual"
            href="https://github.com/steves460ng/color-cal/blob/main/docs/user-guide.md"
            target="_blank"
            rel="noopener noreferrer"
            title="GitHub 사용자 매뉴얼 (새 창으로 열림)"
            aria-label="도움말 · 사용자 매뉴얼 (새 창으로 열림)"
            ><b aria-hidden="true">?</b>도움말 <span aria-hidden="true">↗</span></a
          >
        </nav>
        <div class="side-note">
          <span class="channel c">C</span><span class="channel m">M</span
          ><span class="channel y">Y</span><span class="channel k">K</span>
          <p>단색 채널을 독립적으로 보정합니다.</p>
          <p>
            측정 데이터는 이 브라우저에 저장됩니다. 정기적으로 JSON 백업을
            내려받으세요.
          </p>
        </div>
      </aside>
      <main id="content" tabindex="-1"><p>작업실을 준비하고 있습니다.</p></main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript
      >이 앱은 JavaScript가 필요합니다. 브라우저 설정에서
      활성화하세요.</noscript
    >
  </body>
</html>
